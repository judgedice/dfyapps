name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Queue back-to-back merges instead of colliding on the Container App.
concurrency:
  group: deploy-dfyapps
  cancel-in-progress: false

permissions:
  contents: read

env:
  RESOURCE_GROUP: rg-dreemweaver-hub
  REGISTRY: dreemweaverhubacr
  APP_NAME: dfyapps

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Log in to Azure
        uses: azure/login@v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # Built inside the registry, as the hub does, so the runner never pulls from Docker Hub.
      - name: Build and push image via ACR Build
        run: |
          az acr build \
            --registry "$REGISTRY" \
            --resource-group "$RESOURCE_GROUP" \
            --image "$APP_NAME:${{ github.sha }}" \
            --image "$APP_NAME:latest" \
            --build-arg "BUILD_SHA=${{ github.sha }}" \
            .

      # The Container App is created once by hand (docs/azure-setup.md). Until then this only warns.
      - name: Deploy to Container Apps
        id: deploy
        run: |
          if ! az containerapp show --name "$APP_NAME" --resource-group "$RESOURCE_GROUP" >/dev/null 2>&1; then
            echo "::warning::Container App $APP_NAME not found; image pushed but not deployed. See docs/azure-setup.md."
            echo "deployed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          az containerapp update \
            --name "$APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --image "$REGISTRY.azurecr.io/$APP_NAME:${{ github.sha }}"
          echo "deployed=true" >> "$GITHUB_OUTPUT"

      # `update` returns before the new revision serves traffic. Wait until /health reports this commit.
      - name: Wait for the new revision
        if: steps.deploy.outputs.deployed == 'true'
        run: |
          FQDN=$(az containerapp show --name "$APP_NAME" --resource-group "$RESOURCE_GROUP" \
            --query properties.configuration.ingress.fqdn -o tsv)
          for i in $(seq 1 30); do
            if curl -fsS "https://$FQDN/health" | grep -q "${{ github.sha }}"; then
              echo "Revision ${{ github.sha }} is live."
              exit 0
            fi
            sleep 10
          done
          echo "::error::https://$FQDN/health did not report ${{ github.sha }} within 5 minutes."
          exit 1
